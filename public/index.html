<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QuickFix – Home Services</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#12071f;--bg2:#3b1466;--card:#1c1233;--bd:#3d2c63;--tx:#F3EEFF;--mu:#b8a9d6;--ac:#22D3EE;--am:#F59E0B;--ok:#34D399;--er:#F87171;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--tx);background:linear-gradient(160deg,var(--bg),var(--bg2)) fixed;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:10px;align-items:center;padding:12px 28px;background:rgba(26,11,46,.7);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.logo{font-weight:700;font-size:22px;cursor:pointer;display:flex;align-items:center;gap:8px;color:#22d3ee}.logo b{background:linear-gradient(90deg,#22d3ee,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}.lg{display:inline-flex;width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#22d3ee,#9333ea);align-items:center;justify-content:center;font-size:18px}.nl{color:#d8cdf0;cursor:pointer;font-weight:500;padding:0 8px}.nl:hover{color:var(--ac)}
.sp{flex:1}.wrap{max-width:1050px;margin:0 auto;padding:22px 18px 90px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:14px;transition:.2s}
.card.h:hover{border-color:var(--ac);transform:translateY(-2px);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.btn{background:linear-gradient(90deg,#06b6d4,#9333ea);color:#fff;border:0;border-radius:99px;padding:9px 18px;font-weight:600;cursor:pointer;transition:.2s}
.btn:hover{filter:brightness(1.1)}.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.r{background:var(--er);color:#2a0606}.btn.a{background:var(--am);color:#2a1a00}
.btn.s{padding:6px 11px;font-size:13px}
input,select,textarea{width:100%;background:#241a3b;border:1px solid var(--bd);border-radius:10px;padding:10px;margin:5px 0 10px}
label{font-size:13px;color:var(--mu)}
h1{font-size:34px;margin:6px 0}h2{margin:4px 0 12px}h3{margin:0 0 6px}
.mu{color:var(--mu);font-size:14px}.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;background:#0f2a33;color:var(--ac)}
.pill.a{background:#3a2a07;color:var(--am)}.pill.o{background:#0b2e22;color:var(--ok)}.pill.e{background:#3a1212;color:var(--er)}
.price{font-size:24px;font-weight:700}.old{text-decoration:line-through;color:var(--mu);font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.hero{padding:44px 0 20px}.hero h1 span{color:var(--ac)}
.bar{height:8px;border-radius:9px;background:#0f141c;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ok));transition:width .6s}
.map{position:relative;height:120px;border-radius:12px;background:repeating-linear-gradient(0deg,#101722 0 24px,#131c29 24px 25px),#101722;overflow:hidden;border:1px solid var(--bd)}
.dot{position:absolute;top:50px;font-size:24px;transition:left .8s}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:9px 6px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mu);font-weight:500}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:14px}
.modal>div{background:rgba(22,28,38,.96);border:1px solid var(--bd);border-radius:16px;padding:22px;width:100%;max-width:460px;max-height:90vh;overflow:auto}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--ac);padding:11px 18px;border-radius:12px;z-index:50}
.chatb{position:fixed;right:16px;bottom:16px;z-index:15;width:54px;height:54px;border-radius:50%;font-size:24px;border:0;background:var(--ac);cursor:pointer}
.chat{position:fixed;right:16px;bottom:80px;width:320px;max-width:92vw;z-index:15;display:flex;flex-direction:column;height:380px}
.msgs{flex:1;overflow:auto;font-size:14px}.msgs p{margin:6px 0;padding:8px 10px;border-radius:10px;background:#0f141c;max-width:85%}.msgs p.u{background:#0f2a33;margin-left:auto}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:0 0 auto}
.kpi{font-size:28px;font-weight:700;color:var(--ac)}
.sec{padding:46px 0;text-align:center;scroll-margin-top:80px}.sec h2{font-size:32px;margin:0 0 8px}.sec>p{color:var(--mu);margin:0 0 28px}.tl{text-align:left;border-radius:20px;padding:26px;border:1px solid var(--bd);cursor:pointer;transition:.25s}.tl:hover{transform:translateY(-4px);filter:brightness(1.15)}.ic{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:14px}.tl ul{list-style:none;padding:0;margin:12px 0 0;color:#d8cdf0;font-size:14px;line-height:1.9}.gt{background:linear-gradient(90deg,#22d3ee,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}.step{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#06b6d4,#9333ea);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;margin:0 auto 14px}.foot{background:rgba(5,3,12,.7);margin:40px -18px -90px;padding:36px 28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:24px;text-align:left}.foot a{display:block;color:var(--mu);margin:8px 0;cursor:pointer}.foot a:hover{color:var(--ac)}.lt{transform:rotate(3deg);background:linear-gradient(135deg,#06b6d4,#9333ea);padding:22px;border-radius:28px;cursor:pointer;min-width:260px}.lt>div{background:#0b0716;border-radius:20px;padding:20px}.sos{position:fixed;left:16px;bottom:16px;z-index:15;background:var(--er);color:#2a0606;border:0;border-radius:99px;padding:12px 18px;font-weight:700;cursor:pointer}
</style></head><body><div id="app"></div><div id="ov"></div>
<script>
/* ============ BACKEND LAYER (swap with Supabase/Express later) ============ */
const SV=[
{id:'clean',n:'Home Cleaning',i:'🧹',p:[399,549,699],d:'Deep cleaning, about 3 hrs',w:0,subs:['Full home','Kitchen','Bathroom']},
{id:'cook',n:'Cooking',i:'🍳',p:[299,399,499],d:'Home cook per day',w:0,subs:['Daily meals','Party cooking']},
{id:'baby',n:'Baby Care',i:'👶',p:[499,649,799],d:'Verified nanny per day',w:0,subs:['Day care','Night care']},
{id:'plumb',n:'Plumbing',i:'🔧',p:[99,149,199],d:'Visit charge, repairs extra by quote',w:15,subs:['Leak fix','Tap/Fitting','Drain block']},
{id:'elec',n:'Electrical',i:'💡',p:[99,149,199],d:'Visit charge, repairs extra by quote',w:30,subs:['Wiring','Fan/Light','Switchboard']},
{id:'remodel',n:'Home Remodelling',i:'🏠',p:[0,0,0],d:'Free site visit and quote, milestone payments',w:30,subs:['Painting','Carpentry','Full renovation']}];
SV.push({id:'ac',n:'AC Service',i:'❄️',p:[249,349,449],d:'Cleaning and gas check',w:30,subs:['Split AC','Window AC']},{id:'appl',n:'Appliance Repair',i:'🔌',p:[99,149,199],d:'Washing machine, fridge, TV; visit charge',w:30,subs:['Washing machine','Fridge','TV']},{id:'carp',n:'Carpentry',i:'🪚',p:[149,199,249],d:'Furniture and door repairs',w:15,subs:['Door/lock','Furniture','Shelves']},{id:'pest',n:'Pest Control',i:'🐜',p:[299,449,599],d:'Cockroach, ants and termite treatment',w:90,subs:['Cockroach','Termite','Full home']},{id:'tank',n:'Water Tank Cleaning',i:'🚰',p:[349,499,599],d:'Sump and overhead tank',w:0,subs:['Overhead tank','Sump']});
const TM={clean:'3–4 hrs',cook:'2 hrs per meal',baby:'8 hrs',plumb:'45–90 min',elec:'45–90 min',remodel:'Visit 1 hr, work 3–15 days',ac:'60–90 min',appl:'45–90 min',carp:'1–2 hrs',pest:'1–2 hrs',tank:'2–3 hrs'};
SV.push({id:'ride',n:'Personal Transport',i:'🚗',p:[49,79,99],d:'Reliable rides for appointments and shopping',w:0,subs:['Auto','Cab','Bike taxi']},{id:'pkg',n:'Package Delivery',i:'📦',p:[29,39,49],d:'Same-day delivery of parcels and groceries',w:0,subs:['Documents','Parcel','Groceries']},{id:'move',n:'Moving Services',i:'🚚',p:[299,449,599],d:'Furniture and home relocation with movers',w:0,subs:['Few items','1 BHK','2 BHK']},{id:'emerg',n:'Emergency Services',i:'⚡',p:[149,199,249],d:'Urgent 24/7 home emergencies, rapid response',w:0,subs:['Water leak','Power failure','Lockout']});Object.assign(TM,{ride:'15–45 min',pkg:'30–90 min',move:'3–6 hrs',emerg:'30–60 min arrival'});
const AREAS=['Gachibowli','Madhapur','Kukatpally','Banjara Hills'];
const seed=()=>({workers:[
{id:1,name:'Ravi Kumar',sk:['plumb','elec'],ar:['Gachibowli','Madhapur'],rt:4.8,on:1,st:'Active',pen:0},
{id:2,name:'Lakshmi Devi',sk:['clean','cook','baby'],ar:['Madhapur','Kukatpally'],rt:4.9,on:1,st:'Active',pen:0},
{id:3,name:'Suresh Reddy',sk:['plumb','elec','remodel'],ar:['Kukatpally','Banjara Hills'],rt:4.4,on:1,st:'Active',pen:1},
{id:4,name:'Anitha Rao',sk:['clean','baby','cook'],ar:['Gachibowli','Banjara Hills'],rt:4.6,on:1,st:'Active',pen:0}],
bookings:[],complaints:[{id:1,bid:'QF-1000',wid:3,type:'Worker demanded extra money',txt:'Asked Rs 500 extra in cash',st:'Under review'}],
rules:{late:50,otw:100,free:2},seq:1001});
let DB;try{DB=JSON.parse(localStorage.getItem('qf'))}catch(e){}
if(!DB||!DB.workers||!DB.users){DB=seed();DB.users={'9999999999':{name:'Admin',pw:'admin123',role:'Admin'}};const x=[['ac','appl'],['pest'],['carp','tank'],['pest','tank','ac']];DB.workers.forEach((w,i)=>{w.ph='900000000'+(i+1);w.sk.push(...x[i]);DB.users[w.ph]={name:w.name,pw:'worker123',role:'Worker'}})}
const save=()=>{try{localStorage.setItem('qf',JSON.stringify(DB))}catch(e){}};
const API={
 count:ph=>DB.bookings.filter(b=>b.ph==ph&&b.st!='Cancelled').length,
 tier:ph=>Math.min(API.count(ph),2),
 price:(s,ph)=>s.p[API.tier(ph)],
 workerFor:(s,area)=>DB.workers.filter(w=>w.on&&w.st=='Active'&&w.sk.includes(s.id)&&w.ar.includes(area)).sort((a,b)=>b.rt-a.rt)[0],
 book(o){const s=SV.find(x=>x.id==o.sv),w=API.workerFor(s,o.area);if(!w)return null;
  const b={id:'QF-'+DB.seq++,ph:o.ph,sv:s.id,sub:o.sub,area:o.area,hrs:+o.hrs,price:API.price(s,o.ph),pay:o.pay,wid:w.id,st:'Confirmed',date:new Date().toLocaleDateString('en-IN'),otp1:''+(1000+Math.random()*9000|0),otp2:''+(1000+Math.random()*9000|0),
  earn:Math.round(s.p[2]*.8),tier:API.tier(o.ph)+1};DB.bookings.unshift(b);save();return b},
 fee(b){if(b.st=='On the way')return DB.rules.otw;return b.hrs<DB.rules.free?DB.rules.late:0},
 cancel(b){b.fee=API.fee(b);b.st='Cancelled';b.refund=Math.max(b.price-b.fee,0);save()},
 rate(b,n,w){b.rated=n;w.rt=+((w.rt*9+n)/10).toFixed(2);if(w.rt<3.5)w.st='Suspension review';save()},
 complain(b,type,txt){DB.complaints.unshift({id:DB.complaints.length+1,bid:b.id,wid:b.wid,type,txt,st:'Submitted'});save()},
 penalize(w){w.pen++;w.st=w.pen>=4?'Banned':w.pen==3?'Suspended':w.st;save()}
};
/* ============ i18n ============ */
const T={en:{services:'Services',bookings:'My Bookings',help:'Help',book:'Book now',intro:'Intro offers used',login:'Get Started',out:'Logout',price:'Price'},
te:{services:'సేవలు',bookings:'నా బుకింగ్‌లు',help:'సహాయం',book:'ఇప్పుడే బుక్ చేయండి',intro:'వాడిన ఆఫర్లు',login:'లాగిన్',out:'లాగౌట్',price:'ధర'},
hi:{services:'सेवाएँ',bookings:'मेरी बुकिंग',help:'सहायता',book:'अभी बुक करें',intro:'उपयोग किए ऑफ़र',login:'लॉगिन',out:'लॉगआउट',price:'कीमत'}};
/* ============ UI ============ */
DB.workers.forEach(w=>{if(!w.m2&&w.id<=4){w.m2=1;w.sk.push('ride','pkg','move','emerg')}});const SS=(()=>{try{return JSON.parse(localStorage.getItem('qfs'))||{}}catch(e){return{}}})();const S={role:DB.users[SS.p]?SS.r:null,ph:DB.users[SS.p]?SS.p:'',pg:'home',arg:null,lang:'en',chat:0,msgs:[['b','Hi! Ask me about services, pricing, cancellation or complaints.']]};
const t=k=>T[S.lang][k]||k,$=id=>document.getElementById(id),sv=id=>SV.find(s=>s.id==id),wk=id=>DB.workers.find(w=>w.id==id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const go=(pg,arg)=>{S.pg=pg;S.arg=arg;draw();scrollTo(0,0)};
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
const modal=h=>{$('ov').innerHTML=h?`<div class="modal" onclick="if(event.target==this)modal()"><div>${h}</div></div>`:''};
const pill=s=>`<span class="pill ${/Completed|Resolved|Active/.test(s)?'o':/Cancel|Ban|Susp/.test(s)?'e':/progress|Under|way/.test(s)?'a':''}">${s}</span>`;
function nav(){return `<div class="nav"><div class="logo" onclick="go('home')"><span class="lg">⚡</span><b>QuickFix</b></div><div class="sp"></div>${!S.role?['Services','Transport','How It Works','About','Contact'].map(x=>`<a class="nl" onclick="jump('${x}')">${x}</a>`).join('')+'<div class="sp"></div>':''}
<select style="width:auto;margin:0" onchange="S.lang=this.value;draw()">${[['en','English'],['te','తెలుగు'],['hi','हिन्दी']].map(l=>`<option value="${l[0]}" ${S.lang==l[0]?'selected':''}>${l[1]}</option>`).join('')}</select>
${S.role?`<span class="pill">${S.role} · ${esc(DB.users[S.ph]?DB.users[S.ph].name:'')}</span><button class="btn g s" onclick="logout()">${t('out')}</button>`:`<button class="btn s" onclick="go('login')">${t('login')}</button>`}</div>`}
function draw(){const r=S.role;let v;
 if(S.pg=='login')v=vLogin();
 else if(r=='Customer')v=vCust();else if(r=='Worker')v=vWork();else if(r=='Admin')v=vAdmin();else v=vLand();
 $('app').innerHTML=nav()+`<div class="wrap">${v}</div>`+(r=='Customer'?chatUI()+`<button class="sos" onclick="sos()">🚨 SOS</button>`:'')}
function vLand(){return `<div class="hero"><span class="pill a">Hyderabad · Verified professionals</span><h1>Home services, <span>fixed up front.</span></h1>
<p class="mu" style="max-width:560px">Cleaning, cooking, baby care, plumbing, electrical and remodelling. Your first 3 bookings are specially priced for you.</p>
<div class="row"><button class="btn" onclick="go('login')">Get started</button></div></div>
<h2>${t('services')}</h2><div class="grid">${SV.map(s=>`<div class="card"><div style="font-size:30px">${s.i}</div><h3>${s.n}</h3><div class="mu">${s.d}</div>${priceRow(s,-1)}</div>`).join('')}</div>
<div class="card"><h3>Loyalty pricing</h3><p class="mu">Booking 1: biggest saving. Booking 2: smaller saving. Booking 3 onward: normal price. Discounts are funded by QuickFix, so worker earnings are never reduced. From booking 3 onward prices stay moderate and fixed, built for middle-class families.</p></div>`}
const INFO={'About Us':'QuickFix connects Hyderabad families with verified home service professionals at fair, fixed prices.','Careers':'Join as a service professional: choose Worker when you sign up and complete verification.','Privacy Policy':'We collect only what we need to deliver your service. Trusted-contact data is shared only with your consent.','Terms of Service':'Prices are shown up front. Extra work needs your approval in the app. Cancellation rules are shown at booking.','Help Center':'Call 1800-123-4567 (24/7) or use the in-app assistant after login.','Safety':'All workers are verified. Use the SOS button during any active service.','Community':'Rate your workers and share feedback to help others choose well.'};
function info(k){modal(`<h3>${k}</h3><p class="mu">${INFO[k]}</p><button class="btn" onclick="modal()">Close</button>`)}
function jump(x){if(S.pg!='home'){S.pg='home';draw()}setTimeout(()=>{const e=$(x.replace(/ /g,''));e&&e.scrollIntoView({behavior:'smooth'})},60)}
function pick(id){if(S.role=='Customer')bookUI(id);else{S.pend=id;toast(S.role?'Login as a customer to book':'Please login to book');if(!S.role)go('login')}}
function qb(){const v=$('qs').value;if(!v)return toast('Select a service');pick(v)}
function clr(id){document.querySelectorAll('#'+id+' input,#'+id+' textarea,#'+id+' select').forEach(e=>{if(e.tagName=='SELECT')e.selectedIndex=0;else e.value=''})}
function send(){const n=$('cn').value.trim(),m=$('cm').value.trim();if(!n||!m)return toast('Enter your name and message');(DB.msgs=DB.msgs||[]).push({n,a:$('ca').value,m,d:new Date().toLocaleString()});save();clr('Contact');toast('Message sent. We will reply soon')}
function vLand(){const tl=(id,ic,bg,col,t,d,li)=>`<div class="tl" style="background:${bg}" onclick="pick('${id}')"><div class="ic" style="background:${col}">${ic}</div><h3 style="font-size:21px">${t}</h3><div style="color:#d8cdf0">${d}</div><ul>${li.map(x=>`<li>✔ ${x}</li>`).join('')}</ul></div>`;
const tr=(id,ic,bg,col)=>{const s=sv(id);return `<div class="tl" style="background:${bg}" onclick="pick('${id}')"><div class="ic" style="background:${col}">${ic}</div><h3 style="font-size:21px">${s.n}</h3><div style="color:#d8cdf0">${s.d}</div><p style="color:${col};font-weight:600;margin:14px 0 0">Starting from ₹${s.p[0]}</p></div>`};
return `<div class="row" style="justify-content:space-between;gap:30px;padding:50px 0 30px"><div style="flex:1 1 380px"><h1 style="font-size:54px;line-height:1.1">On-Demand <span class="gt">Everything</span> at Your Doorstep</h1><p style="font-size:18px;color:#d8cdf0">From emergency repairs to transportation and delivery, get professional services in Hyderabad instantly, just like ordering a ride.</p><div class="row"><button class="btn" style="padding:15px 28px" onclick="jump('Book')">Book Service Now</button><button class="btn g" style="padding:15px 28px;border-color:#22d3ee;color:#22d3ee" onclick="jump('Services')">Learn More</button></div></div>
<div class="lt" onclick="pick('plumb')"><div><div class="row"><b>Live Tracking</b><span class="sp"></span><span class="pill o">Active</span></div><p>🔧 Emergency Plumbing</p><p>📍 Gachibowli, Hyderabad</p><p>🕒 Arriving in 8 mins</p></div></div></div>
<div class="sec" id="Book"><h2>Quick Service Booking</h2><p>Book any service in seconds</p><div class="card" style="max-width:820px;margin:auto;text-align:left"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))"><select id="qs"><option value="">Select Service</option>${SV.map(s=>`<option value="${s.id}">${s.i} ${s.n}</option>`).join('')}</select><select>${AREAS.map(a=>`<option>${a}</option>`).join('')}</select><input type="date"><input type="time"></div><textarea rows="3" placeholder="Describe your service needs..."></textarea><div class="row"><button class="btn" style="flex:1;padding:13px" onclick="qb()">Book Now</button><button class="btn g" onclick="clr('Book')">✕ Clear</button></div></div></div>
<div class="sec" id="Services"><h2>Our Services</h2><p>Professional, reliable and affordable services for all your home and family needs</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">${tl('plumb','🔧','linear-gradient(135deg,#1e2a78,#2d1b69)','#3b82f6','Plumbing Works','Emergency repairs, installations and maintenance. From leaky faucets to major pipe work.',['24/7 Emergency Service','Licensed Professionals','Quality Guarantee'])}${tl('carp','🔨','linear-gradient(135deg,#243447,#3a3558)','#4ade80','Home Repairs','Carpentry, painting, electrical and general maintenance.',['Carpentry & Woodwork','Painting & Decoration','Electrical Repairs'])}${tl('clean','🏠','linear-gradient(135deg,#3b1670,#5b21a6)','#a855f7','Home Utilities','Cleaning, appliance repair and utility services.',['Deep Cleaning','Appliance Service','AC Maintenance'])}${tl('baby','👶','linear-gradient(135deg,#5a1650,#4a1560)','#ec4899','Baby Care','Trusted, verified nannies and childcare professionals.',['Background Verified','Experienced Caregivers','Flexible Scheduling'])}${tl('remodel','💡','linear-gradient(135deg,#5e2450,#5a2a5a)','#f97316','Specialized Repairs','Roofing, flooring and remodelling with free site visit and quote.',['Roofing & Gutters','Flooring Installation','Milestone Payments'])}${tl('emerg','⚡','linear-gradient(135deg,#6a1a4a,#5a1660)','#ef4444','Emergency Services','Urgent home emergencies, 24/7 rapid response.',['24/7 Availability','Fast Response','Emergency Equipment'])}</div><div class="row" style="justify-content:center;margin-top:20px"><span class="mu">More:</span>${['cook','elec','ac','appl','pest','tank'].map(i=>`<button class="btn g s" onclick="pick('${i}')">${sv(i).i} ${sv(i).n}</button>`).join('')}</div></div>

<div class="sec" id="Contact"><h2>Get In Touch</h2><p>Ready to experience the future of home services?</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));text-align:left"><div><h3>Contact Information</h3><p>📞 <a href="tel:18001234567" style="color:var(--ac)">1800-123-4567</a> (24/7)</p><p>✉️ <a href="mailto:hello@quickfix.com" style="color:var(--ac)">hello@quickfix.com</a></p><p>📍 Hyderabad, Telangana</p></div><div class="card"><h3>Send us a message</h3><input id="cn" placeholder="Your Name"><input id="ca" placeholder="Your Phone or Address"><textarea id="cm" rows="4" placeholder="Your Message"></textarea><div class="row"><button class="btn" style="flex:1" onclick="send()">Send Message</button><button class="btn g" onclick="clr('Contact')">✕ Clear</button></div></div></div></div>
<div class="foot"><div><div class="logo"><span class="lg">⚡</span><b>QuickFix</b></div><p class="mu">Revolutionizing on-demand home services with professional care and reliability.</p><span class="pill">🛡️ Trusted & Secure</span></div><div><h3 style="color:#22d3ee">Services</h3><a onclick="pick('plumb')">Plumbing</a><a onclick="pick('carp')">Home Repairs</a><a onclick="jump('Transport')">Transportation</a><a onclick="pick('baby')">Baby Care</a></div><div><h3 style="color:#c084fc">Company</h3>${['About Us','Careers','Privacy Policy','Terms of Service'].map(k=>`<a onclick="info('${k}')">${k}</a>`).join('')}</div><div><h3 style="color:#22d3ee">Support</h3><a onclick="jump('Contact')">Contact Us</a>${['Help Center','Safety','Community'].map(k=>`<a onclick="info('${k}')">${k}</a>`).join('')}</div></div>`}
function priceRow(s,tier){if(!s.p[2])return `<div class="price" style="margin-top:8px">Free site visit</div>`;
 return tier<0?`<div class="mu" style="margin-top:8px">₹${s.p[0]} → ₹${s.p[1]} → ₹${s.p[2]}</div>`:`<div style="margin-top:8px"><span class="price">₹${s.p[tier]}</span> ${tier<2?`<span class="old">₹${s.p[2]}</span>`:''}</div>`}
function vLogin(){return `<div class="card" style="max-width:420px;margin:30px auto"><h2>Login</h2><label>Role</label><select id="lr"><option>Customer</option><option>Worker</option><option>Admin</option></select>
<label>Phone number</label><input id="lp" placeholder="9876543210" maxlength="10" inputmode="numeric"><label>OTP (demo: 123456)</label><input id="lo" maxlength="6" inputmode="numeric">
<button class="btn" style="width:100%" onclick="login()">Verify and continue</button></div>`}
function login(){const p=$('lp').value.trim(),o=$('lo').value.trim();
 if(!/^\d{10}$/.test(p))return toast('Enter a valid 10-digit number');if(o!='123456')return toast('Wrong OTP. Use 123456');
 S.role=$('lr').value;S.ph=p;S.pg='home';draw();toast('Welcome to QuickFix')}
/* ---- Customer ---- */
function vCust(){const tabs=[['home',t('services')],['bk',t('bookings')],['help',t('help')]];
 let h=`<div class="tabs">${tabs.map(x=>`<button class="btn ${S.pg==x[0]?'':'g'} s" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div>`;
 if(S.pg=='home'){const n=Math.min(API.count(S.ph),3);
  h+=`<div class="card"><div class="row"><h3 style="margin:0">${t('intro')}: ${n} of 3</h3><span class="pill a">${n<3?'Next booking: '+['Best','Great','Good'][n]+' price':'Normal pricing active'}</span></div><div class="bar" style="margin-top:10px"><i style="width:${n/3*100}%"></i></div></div>
  <div class="grid">${SV.map(s=>`<div class="card h" onclick="bookUI('${s.id}')"><div style="font-size:30px">${s.i}</div><h3>${s.n}</h3><div class="mu">${s.d}</div><div class="mu">⏱️ ${TM[s.id]}</div>${priceRow(s,API.tier(S.ph))}${s.w?`<div class="mu" style="margin-top:6px">🛡️ ${s.w}-day warranty</div>`:''}<button class="btn s" style="margin-top:10px">${t('book')}</button></div>`).join('')}</div>`}
 if(S.pg=='bk'){const L=DB.bookings.filter(b=>b.ph==S.ph&&(!S.f||b.st==S.f||(S.f=='Active'&&!['Completed','Cancelled'].includes(b.st))));h+=`<div class="row" style="margin-bottom:12px">${['','Active','Completed','Cancelled'].map(f=>`<button class="btn ${(S.f||'')==f?'':'g'} s" onclick="S.f='${f}';draw()">${f||'All'}</button>`).join('')}<span class="mu">Total paid: ₹${DB.bookings.filter(b=>b.ph==S.ph&&b.paid).reduce((a,b)=>a+b.bill.tot,0)}</span></div>`;h+=L.length?L.map(b=>`<div class="card h" onclick="go('det','${b.id}')"><div class="row"><b>${sv(b.sv).i} ${sv(b.sv).n}</b><span class="sp"></span>${pill(b.st)}</div><div class="mu">${b.id} · ${b.date} · ${b.area} · ₹${b.price}${b.bill?' · Bill ₹'+b.bill.tot+(b.paid?' (Paid)':' (Due)'):''}</div></div>`).join(''):`<div class="card mu">No bookings yet. Pick a service to start.</div>`}
 if(S.pg=='det')h+=vDet(DB.bookings.find(b=>b.id==S.arg));
 if(S.pg=='help')h+=`<div class="card"><h3>Helpline (24/7)</h3><p class="price">1800-123-4567</p><p class="mu">Demo number. Replace with your company line.</p><a class="btn a s" href="#" onclick="toast('Opening WhatsApp support (demo)');return false">WhatsApp support</a></div>
 <div class="card"><h3>Cancellation policy</h3><p class="mu">Free cancellation up to ${DB.rules.free} hours before the slot. Within ${DB.rules.free} hours: ₹${DB.rules.late} fee. Worker already on the way: ₹${DB.rules.otw} fee. Worker late over 30 minutes: free cancellation plus compensation credit. Refunds: Initiated, Processing, Refunded.</p></div>
 <div class="card"><h3>Trusted contacts (max 3)</h3><p class="mu">With your consent, these contacts receive booking details and live tracking during in-home and childcare services.</p><input id="tc" placeholder="Name – phone"><button class="btn s" onclick="toast('Contact saved with consent (demo)')">Add contact</button></div>`;
 return h}
function bookUI(id){const s=sv(id),tr=API.tier(S.ph);
 modal(`<h3>${s.i} ${s.n}</h3>${priceRow(s,tr)}<p class="mu">⏱️ Takes about ${TM[s.id]}</p><label>Type</label><select id="bs">${s.subs.map(x=>`<option>${x}</option>`).join('')}</select>
 <label>Area</label><select id="ba">${AREAS.map(a=>`<option>${a}</option>`).join('')}</select>
 <label>Time slot</label><select id="bh"><option value="1">In 1 hour</option><option value="3">In 3 hours</option><option value="24">Tomorrow</option></select>
 <label>Payment</label><select id="bp"><option value="Online">Pay online after work (bill generated)</option><option value="Offline">Pay offline (cash to worker)</option></select>
 <p class="mu">Fixed price shown above. Extra work needs your approval in the app. Free cancel up to ${DB.rules.free} hrs before slot.</p>
 <div class="row"><button class="btn" onclick="confirmBook('${id}')">Confirm booking</button><button class="btn g" onclick="modal()">Close</button></div>`)}
function confirmBook(id){const b=API.book({sv:id,sub:$('bs').value,area:$('ba').value,hrs:$('bh').value,pay:$('bp').value,ph:S.ph});
 if(!b)return toast('No worker available in that area right now');modal();toast('Booked! '+b.id);go('det',b.id)}
function vDet(b){const s=sv(b.sv),w=wk(b.wid),pos={Confirmed:5,'On the way':50,'In progress':88,Completed:88,Cancelled:5}[b.st];
 let h=`<button class="btn g s" onclick="go('bk')">← Back</button><div class="card" style="margin-top:12px"><div class="row"><h3 style="margin:0">${s.i} ${s.n} · ${b.id}</h3><span class="sp"></span>${pill(b.st)}</div>
 <p class="mu">${b.sub} · ${b.area} · 💳 ${b.pay=='Online'?'Online payment':'Offline (cash to worker)'}${b.paid?' · Paid':''} · Price tier ${b.tier} of 3 · <b>₹${b.price}</b></p>
 <p>👷 ${esc(w.name)} · 📞 <a href="tel:${w.ph}" style="color:var(--ac)">${w.ph}</a> · ⭐ ${w.rt}${w.rt>=4.7?' <span class="pill a">Verified Pro</span>':''}</p>`;
 if(b.st=='On the way'||b.st=='Confirmed'||b.st=='In progress')h+=`<div class="map"><span class="dot" style="left:${pos}%">🛵</span><span class="dot" style="right:6%;top:46px">🏠</span></div><p class="mu">${b.st=='On the way'?'ETA 12 min':b.st=='Confirmed'?'Worker will start the trip shortly':'Worker on site'}</p>`;
 if(b.st=='Confirmed'||b.st=='On the way')h+=`<p>Start OTP (share with worker on arrival): <b class="pill a" style="font-size:16px">${b.otp1}</b></p>`;
 if(b.st=='In progress')h+=`<p>End OTP (share when you are satisfied): <b class="pill a" style="font-size:16px">${b.otp2}</b></p><button class="btn a s" onclick="extra('${b.id}')">Review extra-work quote</button>${photos(b)}`;
 if(b.st=='Completed'){h+=`${photos(b)}${billUI(b)}${s.w?`<p class="pill o">🛡️ Warranty active for ${s.w} days</p> <button class="btn g s" onclick="toast('Warranty claim submitted')">Claim warranty</button>`:''}
  ${b.rated?`<p>You rated ${b.rated} ⭐</p>`:`<label>Rate worker</label><div class="row">${[1,2,3,4,5].map(n=>`<button class="btn g s" onclick="rate('${b.id}',${n})">${n}⭐</button>`).join('')}</div>`}`}
 if(b.st=='Cancelled')h+=`<p>Cancellation fee ₹${b.fee}. Refund ₹${b.refund}: ${pill('Processing')}</p>`;
 h+=`</div><div class="row">${!['Completed','Cancelled','In progress'].includes(b.st)?`<button class="btn r s" onclick="cancelUI('${b.id}')">Cancel</button>`:''}<button class="btn g s" onclick="reportUI('${b.id}')">Report a problem</button></div>`;return h}
function cancelUI(id){const b=DB.bookings.find(x=>x.id==id),f=API.fee(b);modal(`<h3>Cancel booking?</h3><p>Cancellation charge: <b>₹${f}</b><br>Refund: <b>₹${b.price-f}</b></p><div class="row"><button class="btn r" onclick="API.cancel(DB.bookings.find(x=>x.id=='${id}'));modal();draw();toast('Cancelled')">Yes, cancel</button><button class="btn g" onclick="modal()">Keep</button></div>`)}
function reportUI(id){modal(`<h3>Report a problem</h3><select id="ct"><option>Worker demanded extra money</option><option>Bad behaviour / abusive language</option><option>Poor quality</option><option>No-show</option><option>Safety concern</option></select><textarea id="cx" rows="3" placeholder="Describe what happened"></textarea><p class="mu">Our team will call you within 1 hour. Helpline: 1800-123-4567</p><button class="btn" onclick="API.complain(DB.bookings.find(x=>x.id=='${id}'),$('ct').value,$('cx').value);modal();toast('Complaint submitted')">Submit</button>`)}
function rate(id,n){const b=DB.bookings.find(x=>x.id==id);API.rate(b,n,wk(b.wid));draw();toast('Thanks for rating')}
function extra(id){modal(`<h3>Extra work quote</h3><p>Worker proposes: Pipe replacement – <b>₹350</b></p><div class="row"><button class="btn" onclick="modal();toast('Approved. Pay in app')">Approve</button><button class="btn g" onclick="modal();toast('Declined')">Decline</button></div>`)}
function sos(){modal(`<h3>🚨 Emergency</h3><p>Alert admin and your trusted contacts with live location?</p><div class="row"><button class="btn r" onclick="modal();toast('SOS sent to admin and trusted contacts')">Send SOS</button><button class="btn g" onclick="modal()">Cancel</button></div>`)}
/* ---- Chatbot ---- */
function chatUI(){return `<button class="chatb" onclick="S.chat=!S.chat;draw()">💬</button>${S.chat?`<div class="card chat"><b>QuickFix Assistant</b><div class="msgs" id="ms">${S.msgs.map(m=>`<p class="${m[0]=='u'?'u':''}">${esc(m[1])}</p>`).join('')}</div><div class="row"><input id="ci" style="flex:1;margin:6px 0" placeholder="Type…" onkeydown="if(event.key=='Enter')ask()"><button class="btn s" onclick="ask()">Send</button></div><a href="#" class="mu" onclick="toast('Connecting to human support: 1800-123-4567');return false">Talk to a human</a></div>`:''}`}
function ask(){const q=$('ci').value.trim();if(!q)return;S.msgs.push(['u',q]);const l=q.toLowerCase();let a='I can help with services, pricing, cancellation and complaints. Which one?';
 if(/price|cost|rate|offer/.test(l))a='Your first booking has the lowest price, the second a little higher, and from the third booking prices are normal. Prices are fixed before you pay.';
 else if(/cancel|refund|resched/.test(l))a=`Free cancellation up to ${DB.rules.free} hours before the slot. After that ₹${DB.rules.late}; if the worker is on the way ₹${DB.rules.otw}. Refunds go Initiated, Processing, Refunded.`;
 else if(/complain|problem|rude|extra money|behav/.test(l))a='Open the booking and tap "Report a problem", choose the issue and submit. We call you within 1 hour. For serious issues use SOS or call 1800-123-4567.';
 else if(/safety|harass|danger|sos|emergency/.test(l))a='This is serious. Please press SOS now. I am escalating this to our human support team.';
 else if(/clean|cook|baby|plumb|elec|repair|renov/.test(l))a='Great choice. Open the service card on the Services tab, pick type, area and time. Worker is auto-matched by area and availability.';
 S.msgs.push(['b',a]);draw();const m=$('ms');if(m)m.scrollTop=1e5}
/* ---- Worker ---- */
function vWork(){const w=DB.workers.find(x=>x.ph==S.ph),jobs=DB.bookings.filter(b=>b.wid==w.id),done=jobs.filter(b=>b.st=='Completed');
 return `<div class="card"><div class="row"><h2 style="margin:0">${esc(w.name)}</h2>${pill(w.st)}<span class="pill">⭐ ${w.rt}</span><span class="sp"></span><button class="btn ${w.on?'':'g'} s" onclick="act('/api/workers/me/online')">${w.on?'🟢 Online':'⚪ Offline'}</button></div>
 <p class="mu">Skills: ${w.sk.map(k=>sv(k).n).join(', ')} · Areas: ${w.ar.join(', ')}</p>
 <div class="row"><div><div class="kpi">₹${done.reduce((a,b)=>a+b.earn,0)}</div><div class="mu">Earnings</div></div><div><div class="kpi">${done.length}</div><div class="mu">Jobs done</div></div><div><div class="kpi">${jobs.filter(b=>!['Completed','Cancelled'].includes(b.st)).length}</div><div class="mu">Active</div></div></div>
 <p class="mu">Your earnings are always based on the full normal price. Intro discounts are paid by QuickFix.</p></div>
 <h2>Jobs</h2>${jobs.length?jobs.map(b=>`<div class="card"><div class="row"><b>${sv(b.sv).i} ${sv(b.sv).n}</b>${pill(b.st)}<span class="sp"></span><b>₹${b.earn}</b></div><div class="mu">${b.id} · ${b.area} · ${b.sub} · 📞 Customer <a href="tel:${b.ph}" style="color:var(--ac)">${b.ph}</a> · 💳 ${b.pay=='Online'?'Online (customer pays after work)':'Offline (collect cash)'}${b.paid?' · Paid via '+(b.method||'cash'):''}</div>
 <div class="row" style="margin-top:8px">${b.st=='Completed'?`${pill(b.paid?'Paid':'Payment pending')} ${!b.paid&&b.pay=='Offline'?`<button class="btn s" onclick="pay('${b.id}')">Cash collected</button>`:''}`:''}${b.st=='Confirmed'?`<button class="btn s" onclick="act('/api/bookings/${b.id}/trip')">Start trip</button>`:''}
 ${b.st=='On the way'?`<label class="btn g s">📸 Before work<input type="file" accept="image/*" capture="environment" hidden onchange="snap(this,'${b.id}','before')"></label>${b.before?'✅':''}<input id="o1${b.id}" placeholder="Customer start OTP" style="width:170px;margin:0"><button class="btn s" onclick="otp('${b.id}',1)">Start job</button>`:''}
 ${b.st=='In progress'?`<label class="btn g s">📸 After work<input type="file" accept="image/*" capture="environment" hidden onchange="snap(this,'${b.id}','after')"></label>${b.after?'✅':''}<input id="o2${b.id}" placeholder="Customer end OTP" style="width:170px;margin:0"><button class="btn s" onclick="otp('${b.id}',2)">Finish job</button>`:''}</div></div>`).join(''):'<div class="card mu">No jobs yet. Book a service as a customer with this worker’s area. Pending accounts need admin approval.</div>'}`}
function otp(id,n){const b=DB.bookings.find(x=>x.id==id),v=$('o'+n+id).value.trim();
 if(v!=(n==1?b.otp1:b.otp2))return toast('Incorrect OTP');if(n==1&&!b.before)return toast('Upload the before-work photo first');if(n==2&&!b.after)return toast('Upload the after-work photo first');if(n==1)b.t0=Date.now();else{b.mins=Math.max(1,Math.round((Date.now()-b.t0)/60000));bill(b)}b.st=n==1?'In progress':'Completed';save();draw();toast(n==1?'Job started':'Job completed')}
/* ---- Admin ---- */
function vAdmin(){const B=DB.bookings,rev=B.filter(b=>b.st=='Completed').reduce((a,b)=>a+b.price,0);
 const tabs=['dash','book','comp','price','work'],nm={dash:'Dashboard',book:'Bookings',comp:'Complaints',price:'Pricing',work:'Workers'};
 let h=`<div class="tabs">${tabs.map(x=>`<button class="btn ${S.pg==x||(S.pg=='home'&&x=='dash')?'':'g'} s" onclick="go('${x}')">${nm[x]}</button>`).join('')}</div>`,p=S.pg=='home'?'dash':S.pg;
 if(p=='dash')h+=`<div class="grid">${[['Bookings',B.length],['Revenue','₹'+rev],['Open complaints',DB.complaints.filter(c=>c.st!='Resolved').length],['Workers',DB.workers.length],['Messages',(DB.msgs||[]).length]].map(k=>`<div class="card"><div class="kpi">${k[1]}</div><div class="mu">${k[0]}</div></div>`).join('')}</div>
 <div class="card"><h3>Bookings by service</h3>${SV.map(s=>{const c=B.filter(b=>b.sv==s.id).length;return `<div class="row" style="margin:6px 0"><span style="width:140px">${s.n}</span><div class="bar" style="flex:1;min-width:120px"><i style="width:${Math.min(c*20,100)}%"></i></div><span>${c}</span></div>`}).join('')}</div>
 <button class="btn g s" onclick="csv()">⬇ Export bookings CSV</button>`;
 if(p=='book')h+=`<div class="card" style="overflow:auto"><table><tr><th>ID</th><th>Service</th><th>Area</th><th>Worker</th><th>Worker phone</th><th>Customer</th><th>Price</th><th>Payment</th><th>Status</th></tr>${B.map(b=>`<tr><td>${b.id}</td><td>${sv(b.sv).n}</td><td>${b.area}</td><td>${wk(b.wid).name}</td><td>${wk(b.wid).ph}</td><td>${b.ph}</td><td>₹${b.price}</td><td>${b.pay}${b.paid?' ✓ '+(b.method||''):' (pending)'}</td><td>${pill(b.st)}</td></tr>`).join('')||'<tr><td colspan=9 class="mu">No bookings</td></tr>'}</table></div>`;
 if(p=='comp')h+=DB.complaints.map(c=>`<div class="card"><div class="row"><b>${c.bid}</b>${pill(c.st)}<span class="sp"></span><span class="mu">Worker: ${wk(c.wid).name}</span></div><p>${esc(c.type)}<br><span class="mu">${esc(c.txt)}</span></p>
 <div class="row"><button class="btn g s" onclick="adv(${c.id})">Advance status</button><button class="btn a s" onclick="API.penalize(wk(${c.wid}));draw();toast('Penalty applied')">Penalise worker</button><button class="btn s" onclick="toast('Refund issued')">Refund</button></div></div>`).join('')+`<p class="mu">Flow: Submitted → Under review → Worker contacted → Resolved. Penalty ladder: warning → fine → suspension → ban.</p>`;
 if(p=='price')h+=`<div class="card" style="overflow:auto"><table><tr><th>Service</th><th>Booking 1</th><th>Booking 2</th><th>Booking 3+</th></tr>${SV.filter(s=>s.p[2]).map(s=>`<tr><td>${s.n}</td>${s.p.map((v,i)=>`<td><input type="number" value="${v}" style="width:90px;margin:0" onchange="act('/api/prices',{id:'${s.id}',i:${i},v:+this.value})"></td>`).join('')}</tr>`).join('')}</table></div>
 <div class="card"><h3>Cancellation rules</h3><label>Free window (hours)</label><input type="number" value="${DB.rules.free}" onchange="act('/api/rules',{k:'free',v:+this.value})"><label>Late fee ₹</label><input type="number" value="${DB.rules.late}" onchange="act('/api/rules',{k:'late',v:+this.value})"><label>Worker-on-the-way fee ₹</label><input type="number" value="${DB.rules.otw}" onchange="act('/api/rules',{k:'otw',v:+this.value})"></div>`;
 if(p=='work')h+=`<div class="card" style="overflow:auto"><table><tr><th>Name</th><th>Phone</th><th>Rating</th><th>Penalties</th><th>Status</th><th></th></tr>${DB.workers.map(w=>`<tr><td>${esc(w.name)}</td><td>${w.ph}</td><td>⭐ ${w.rt}</td><td>${w.pen}</td><td>${pill(w.st)}</td><td><button class="btn g s" onclick="act('/api/workers/${w.id}/toggle')">Toggle</button></td></tr>`).join('')}</table></div><p class="mu">Rating below 4.0: retraining notice. Below 3.5: suspension review.</p>`;
 return h}
function vLogin(){const su=S.su;return `<div class="card" style="max-width:420px;margin:30px auto"><h2>${su?'Create account':'Login'}</h2>${su?`<label>Full name</label><input id="sn"><label>I am a</label><select id="sr" onchange="S.sr=this.value;draw()"><option>Customer</option><option ${S.sr=='Worker'?'selected':''}>Worker</option></select>`:''}${su&&S.sr=='Worker'?`<label>Skill</label><select id="sk">${SV.map(s=>`<option value="${s.id}">${s.n}</option>`).join('')}</select><label>Area</label><select id="sa">${AREAS.map(a=>`<option>${a}</option>`).join('')}</select>`:''}<label>Phone</label><input id="lp" maxlength="10" inputmode="numeric"><label>Password</label><input id="lw" type="password"><button class="btn" style="width:100%" onclick="${su?'signup()':'login()'}">${su?'Sign up':'Login'}</button><p class="mu" style="text-align:center;cursor:pointer" onclick="S.su=!S.su;draw()">${su?'Have an account? Login':'New here? Sign up'}</p>${su?'':'<p class="mu">Demo: admin 9999999999 / admin123 · worker 9000000001 / worker123</p>'}</div>`}
function login(){const p=$('lp').value.trim(),u=DB.users[p];if(!u||u.pw!=$('lw').value)return toast('Wrong phone or password');start(p,u.role)}
function start(p,r){S.role=r;S.ph=p;S.pg='home';try{localStorage.setItem('qfs',JSON.stringify({p,r}))}catch(e){}draw();toast('Welcome, '+DB.users[p].name);if(S.pend&&r=='Customer'){const x=S.pend;S.pend=0;bookUI(x)}}
function signup(){const p=$('lp').value.trim(),n=$('sn').value.trim(),w=$('lw').value,r=$('sr').value;if(!n||!/^\d{10}$/.test(p)||w.length<6)return toast('Enter name, 10-digit phone and a 6+ character password');if(DB.users[p])return toast('Phone already registered');DB.users[p]={name:n,pw:w,role:r};if(r=='Worker')DB.workers.push({id:DB.workers.length+1,ph:p,name:n,sk:[$('sk').value],ar:[$('sa').value],rt:4,on:1,st:'Pending approval',pen:0});save();S.su=0;start(p,r)}
function logout(){S.role=null;S.ph='';try{localStorage.removeItem('qfs')}catch(e){}go('home')}
function snap(inp,id,k){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,480/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);DB.bookings.find(x=>x.id==id)[k]=c.toDataURL('image/jpeg',.6);save();draw();toast('Photo saved')};im.src=e.target.result};r.readAsDataURL(f)}
function photos(b){return b.before||b.after?`<div class="row">${[['Before work',b.before],['After work',b.after]].filter(p=>p[1]).map(p=>`<div><div class="mu">${p[0]}</div><img src="${p[1]}" alt="${p[0]}" style="max-width:200px;border-radius:10px"></div>`).join('')}</div>`:''}
function bill(b){const n=sv(b.sv).p[2],g=Math.round(b.price*.18);b.bill={no:'INV-'+b.id.slice(3),date:new Date().toLocaleDateString('en-IN'),n,d:n-b.price,g,tot:b.price+g}}
function pay(id){const b=DB.bookings.find(x=>x.id==id);b.paid=1;b.method='Cash';save();draw();toast('Cash payment recorded')}
function payUI(id){const b=DB.bookings.find(x=>x.id==id);S.pm=S.pm||'UPI';modal(`<h3>Pay ₹${b.bill.tot}</h3><p class="mu">${b.id} · ${sv(b.sv).n}</p><div class="row" style="margin-bottom:10px">${['UPI','Card','Net banking'].map(m=>`<button class="btn ${S.pm==m?'':'g'} s" onclick="S.pm='${m}';payUI('${id}')">${m}</button>`).join('')}</div>${S.pm=='UPI'?'<label>UPI ID</label><input id="pf" placeholder="name@upi">':S.pm=='Card'?'<label>Card number</label><input id="pf" inputmode="numeric" maxlength="19" placeholder="4111 1111 1111 1111"><div class="row"><input style="width:100px" placeholder="MM/YY"><input style="width:80px" placeholder="CVV" type="password" maxlength="3"></div>':'<label>Bank</label><select id="pf"><option>SBI</option><option>HDFC</option><option>ICICI</option><option>Axis</option></select>'}<p class="mu">Demo payment gateway. No real money is charged and card details are not stored.</p><div class="row"><button class="btn" id="pb" onclick="doPay('${id}')">Pay ₹${b.bill.tot}</button><button class="btn g" onclick="modal()">Cancel</button></div>`)}
function doPay(id){const f=$('pf');if(f&&f.tagName=='INPUT'&&!f.value.trim())return toast('Fill the payment details');$('pb').textContent='Processing…';setTimeout(()=>{const b=DB.bookings.find(x=>x.id==id);b.paid=1;b.method=S.pm;b.txn='TXN'+(Math.random()*1e9|0);save();modal();draw();toast('Payment successful')},1200)}
function billUI(b){const x=b.bill;if(!x)return'';return `<div class="card" style="margin-top:12px;background:#0f141c"><div class="row"><h3 style="margin:0">🧾 Bill ${x.no}</h3><span class="sp"></span><span class="mu">${x.date}</span></div><table><tr><td>${sv(b.sv).n} (standard price)</td><td>₹${x.n}</td></tr>${x.d?`<tr><td>Intro offer discount</td><td style="color:var(--ok)">−₹${x.d}</td></tr>`:''}<tr><td>GST 18%</td><td>₹${x.g}</td></tr><tr><th>Total</th><th>₹${x.tot}</th></tr></table><p class="mu">⏱️ Time taken: ${b.mins} min (estimated ${TM[b.sv]})</p>${b.paid?`<span class="pill o">Paid ${b.method||'offline'}${b.txn?' · '+b.txn:''}</span>`:b.pay=='Online'?`<button class="btn" onclick="payUI('${b.id}')">Pay ₹${x.tot} now</button>`:`<span class="pill a">Pay ₹${x.tot} in cash to the worker</span>`} <button class="btn g s" onclick="print()">Print</button></div>`}
function adv(id){const c=DB.complaints.find(x=>x.id==id),f=['Submitted','Under review','Worker contacted','Resolved'];c.st=f[Math.min(f.indexOf(c.st)+1,3)];save();draw()}
function csv(){const r=['id,service,area,price,status'].concat(DB.bookings.map(b=>[b.id,sv(b.sv).n,b.area,b.price,b.st].join(',')));toast('CSV ready: '+(r.length-1)+' rows (download is available in the file version)')}
draw();
</script><script>
/* ===== Backend integration: all data now comes from the REST API (server.js) ===== */
let TK=null;try{TK=localStorage.getItem('qft')}catch(e){}
DB={workers:[],bookings:[],complaints:[],msgs:[],users:{},rules:{free:2,late:50,otw:100},prices:{}};S.role=null;S.ph='';
async function srv(path,body){const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:Object.assign({'Content-Type':'application/json'},TK?{Authorization:'Bearer '+TK}:{}),body:body===undefined?undefined:JSON.stringify(body)});
 const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status==401&&TK){TK=null;try{localStorage.removeItem('qft')}catch(e){}S.role=null;draw()}throw new Error(j.e||'Request failed')}return j}
async function act(path,body){try{await srv(path,body||{});await sync()}catch(e){toast(e.message)}}
async function sync(){const r=await srv('/api/state');DB=r.state;S.role=r.role;S.ph=r.ph;SV.forEach(s=>{if(DB.prices[s.id])s.p=DB.prices[s.id]});draw()}
async function authGo(u,b){try{const r=await srv(u,b);TK=r.token;try{localStorage.setItem('qft',TK)}catch(e){}S.pg='home';S.su=0;await sync();toast('Welcome, '+r.name);if(S.pend&&r.role=='Customer'){const x=S.pend;S.pend=0;bookUI(x)}}catch(e){toast(e.message)}}
function login(){authGo('/api/login',{phone:$('lp').value.trim(),password:$('lw').value})}
function signup(){authGo('/api/signup',{name:$('sn').value.trim(),phone:$('lp').value.trim(),password:$('lw').value,role:$('sr').value,skill:$('sk')?$('sk').value:null,area:$('sa')?$('sa').value:null})}
function logout(){TK=null;try{localStorage.removeItem('qft')}catch(e){}S.role=null;S.ph='';DB.bookings=[];go('home')}
async function confirmBook(id){try{const r=await srv('/api/bookings',{sv:id,sub:$('bs').value,area:$('ba').value,hrs:$('bh').value,pay:$('bp').value});modal();await sync();toast('Booked! '+r.id);go('det',r.id)}catch(e){toast(e.message)}}
API.cancel=b=>act('/api/bookings/'+b.id+'/cancel');
API.complain=(b,type,txt)=>act('/api/complaints',{bid:b.id,type,txt});
API.penalize=w=>act('/api/workers/'+w.id+'/penalize');
function rate(id,n){act('/api/bookings/'+id+'/rate',{n})}
function otp(id,n){act('/api/bookings/'+id+'/'+(n==1?'start':'finish'),{otp:$('o'+n+id).value.trim()})}
function pay(id){act('/api/bookings/'+id+'/pay',{})}
function adv(id){act('/api/complaints/'+id+'/advance')}
function snap(inp,id,k){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),z=Math.min(1,480/im.width);c.width=im.width*z;c.height=im.height*z;c.getContext('2d').drawImage(im,0,0,c.width,c.height);act('/api/bookings/'+id+'/photo',{kind:k,data:c.toDataURL('image/jpeg',.6)}).then(()=>toast('Photo saved'))};im.src=e.target.result};r.readAsDataURL(f)}
function doPay(id){const f=$('pf');if(f&&f.tagName=='INPUT'&&!f.value.trim())return toast('Fill the payment details');$('pb').textContent='Processing\u2026';setTimeout(async()=>{try{await srv('/api/bookings/'+id+'/pay',{method:S.pm});modal();await sync();toast('Payment successful')}catch(e){toast(e.message)}},1200)}
async function send(){try{await srv('/api/messages',{n:$('cn').value,a:$('ca').value,m:$('cm').value});clr('Contact');toast('Message sent. We will reply soon')}catch(e){toast(e.message)}}
if(TK)sync().catch(()=>draw());else draw();
</script>
</body></html>
